<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando Controle de Vendas</title><body style="font-family:Arial;padding:30px"><h2>Atualizando o aplicativo...</h2><p id="m">Limpando a versão antiga.</p><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}document.getElementById('m').textContent='Pronto. Abrindo a versão atual...';setTimeout(()=>location.replace('./?atualizado=1'),700)}catch(e){document.getElementById('m').textContent='Atualização concluída. Abra o aplicativo novamente.';console.error(e)}})();</script></body></html>
