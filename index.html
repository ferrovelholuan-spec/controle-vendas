<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Vendas</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#174a72"><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17212b}header{background:#174a72;color:#fff;padding:16px;display:flex;justify-content:space-between}main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:12px;margin:12px 0}input,select,button{padding:11px;border-radius:8px;border:1px solid #ccd5dd;font:inherit}button{cursor:pointer}.primary{background:#174a72;color:white;border:0}.danger{background:#b42318;color:#fff;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.hidden{display:none}.login{min-height:100vh;display:grid;place-items:center}.login-card{width:min(400px,90%)}label{display:block;font-weight:bold;margin:8px 0 5px}.msg{margin-top:10px;padding:10px;border-radius:8px}.ok{background:#e8f7ed}.err{background:#fdecec}nav{display:flex;gap:8px;padding:10px;background:white;overflow:auto}nav button.active{background:#174a72;color:#fff}.tab{display:none}.tab.active{display:block}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.table{overflow:auto}</style></head><body>
<div id="loginView" class="login"><div class="card login-card"><h1>Controle de Vendas</h1><label>Usuário</label><input id="loginUser" style="width:100%"><label>Senha</label><input id="loginPass" type="password" style="width:100%"><button class="primary" style="width:100%;margin-top:12px" onclick="login()">ENTRAR</button><div id="loginMsg"></div><p>Administrador: <b>admin</b> / <b>1234</b></p></div></div>
<div id="appView" class="hidden"><header><div><b>Controle de Vendas</b><small id="who"></small></div><button onclick="logout()">Sair</button></header><nav id="nav"></nav><main>
<section id="venda" class="tab"><div class="card"><h2>Registrar venda</h2><div class="grid"><div><label>Data</label><input id="data" type="date"></div><div id="funcWrap"><label>Funcionário</label><select id="funcionario"></select></div><div><label>Material</label><select id="material"></select></div><div><label>Peso (kg)</label><input id="peso" type="number" min="0" step=".01"></div></div><p>Preço/kg: <b id="preco">R$ 0,00</b> — Total: <b id="total">R$ 0,00</b></p><label>Observação</label><input id="obs" style="width:100%"><button class="primary" style="margin-top:12px;width:100%" onclick="registrarVenda()">REGISTRAR VENDA</button><div id="msg"></div></div></section>
<section id="historico" class="tab"><div class="card"><h2>Histórico</h2><div class="table"><table><thead><tr><th>Data</th><th>Funcionário</th><th>Material</th><th>Kg</th><th>Total</th><th></th></tr></thead><tbody id="tabela"></tbody></table></div></div></section>
<section id="resumo" class="tab"><div class="card"><h2>Painel</h2><div class="grid"><div>Total vendido<br><b id="kTotal">R$ 0,00</b></div><div>Kg<br><b id="kKg">0</b></div><div>Vendas<br><b id="kVendas">0</b></div></div></div></section>
<section id="cadastro" class="tab"><div class="card"><h2>Materiais</h2><div class="grid"><div><label>Nome</label><input id="novoMat"></div><div><label>Preço/kg</label><input id="novoPreco" type="number" step=".01"></div></div><button class="primary" onclick="addMaterial()">Adicionar material</button><div class="table"><table><tbody id="cadMat"></tbody></table></div></div><div class="card"><h2>Funcionários</h2><div class="grid"><div><label>Nome</label><input id="novoFunc"></div><div><label>Usuário</label><input id="novoUser"></div><div><label>Senha</label><input id="novoPass" type="password"></div></div><button class="primary" onclick="addFuncionario()">Adicionar funcionário</button><div id="cadMsg"></div><div class="table"><table><tbody id="cadFunc"></tbody></table></div></div></section>
</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://ymajmuqhlrxqxxrgaung.supabase.co',KEY='sb_publishable_eKouIpYxnATga0FCuv33Jg_vd6xtCD_';const sb=supabase.createClient(URL,KEY);let db={materiais:[],funcionarios:[],vendas:[]},session=null,timer;const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),today=()=>new Date().toISOString().slice(0,10);
async function carregar(){const [m,f,v]=await Promise.all([sb.from('materiais').select('id,nome,preco_kg,ativo').eq('ativo',true).order('id'),sb.from('funcionarios').select('id,user_id,nome,usuario,ativo,pass').eq('ativo',true).order('nome'),sb.from('vendas').select('id,data,funcionario_id,material_id,peso_kg,preco_kg,total,observacao').order('id',{ascending:false})]);for(const r of [m,f,v])if(r.error)throw r.error;db.materiais=m.data||[];db.funcionarios=f.data||[];db.vendas=v.data||[];fill();renderAll()}
async function login(){const u=loginUser.value.trim(),p=loginPass.value;if(u==='admin'&&p==='1234')session={role:'admin',name:'Administrador'};else{const r=await sb.from('funcionarios').select('id,nome,usuario,pass,ativo').eq('usuario',u).eq('pass',p).eq('ativo',true).maybeSingle();if(r.error)return showLogin('Erro: '+r.error.message);if(r.data)session={role:'func',id:r.data.id,name:r.data.nome,user:r.data.usuario}}if(!session)return showLogin('Usuário ou senha inválidos.');loginView.classList.add('hidden');appView.classList.remove('hidden');start()}
function showLogin(t){loginMsg.textContent=t;loginMsg.className='msg err'}function logout(){session=null;clearInterval(timer);appView.classList.add('hidden');loginView.classList.remove('hidden')}function start(){who.textContent=session.role==='admin'?'Administrador':'Funcionário: '+session.name;nav.innerHTML=(session.role==='admin'?'<button data-t="resumo">Painel</button>':'')+'<button data-t="venda">Registrar venda</button><button data-t="historico">Histórico</button>'+(session.role==='admin'?'<button data-t="cadastro">Cadastros</button>':'');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t,b));tab(session.role==='admin'?'resumo':'venda',document.querySelector('#nav button'));carregar().catch(e=>alert('Erro ao sincronizar: '+e.message));timer=setInterval(()=>carregar().catch(console.error),10000)}function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active')}
function fill(){funcionario.innerHTML='<option value="">Selecione...</option>'+db.funcionarios.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('');material.innerHTML='<option value="">Selecione...</option>'+db.materiais.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('');data.value||=today();if(session?.role==='func')funcWrap.style.display='none'}function renderAll(){updateTotal();renderHistorico();if(session?.role==='admin'){renderResumo();renderCad()}}function updateTotal(){const m=db.materiais.find(x=>String(x.id)===material.value),p=Number(peso.value)||0;preco.textContent=m?brl(m.preco_kg):brl(0);total.textContent=brl(m?p*Number(m.preco_kg):0)}function msg(t,ok=true){msgEl=t;msg.className='msg '+(ok?'ok':'err');setTimeout(()=>msg.className='',3000)}
async function registrarVenda(){try{const m=db.materiais.find(x=>String(x.id)===material.value),p=Number(peso.value),fid=session.role==='func'?session.id:funcionario.value;if(!data.value||!fid||!m||!(p>0))return msg('Preencha os campos obrigatórios.',false);const r=await sb.from('vendas').insert({data:data.value,funcionario_id:fid,material_id:m.id,peso_kg:p,preco_kg:Number(m.preco_kg),total:p*Number(m.preco_kg),observacao:obs.value.trim()});if(r.error)throw r.error;peso.value='';obs.value='';await carregar();msg('Venda registrada e sincronizada!')}catch(e){msg('Erro ao registrar: '+e.message,false)}}
function visible(){return session.role==='admin'?db.vendas:db.vendas.filter(v=>v.funcionario_id===session.id)}function fn(id){return db.funcionarios.find(x=>x.id===id)?.nome||'Funcionário'}function mn(id){return db.materiais.find(x=>Number(x.id)===Number(id))?.nome||'Material'}function renderHistorico(){tabela.innerHTML=visible().map(v=>`<tr><td>${String(v.data).split('-').reverse().join('/')}</td><td>${esc(fn(v.funcionario_id))}</td><td>${esc(mn(v.material_id))}</td><td>${Number(v.peso_kg).toFixed(2)}</td><td>${brl(v.total)}</td><td>${session.role==='admin'?`<button class="danger" onclick="delVenda(${v.id})">Excluir</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">Nenhuma venda.</td></tr>'}async function delVenda(id){if(!confirm('Excluir venda?'))return;const r=await sb.from('vendas').delete().eq('id',id);if(r.error)alert(r.error.message);else carregar()}
function renderResumo(){const a=visible();kTotal.textContent=brl(a.reduce((s,v)=>s+Number(v.total),0));kKg.textContent=a.reduce((s,v)=>s+Number(v.peso_kg),0).toFixed(2);kVendas.textContent=a.length}function renderCad(){cadMat.innerHTML=db.materiais.map(m=>`<tr><td>${esc(m.nome)}</td><td>${brl(m.preco_kg)}</td><td><button class="danger" onclick="delMat(${m.id})">Excluir</button></td></tr>`).join('');cadFunc.innerHTML=db.funcionarios.map(f=>`<tr><td>${esc(f.nome)}</td><td>${esc(f.usuario)}</td><td><button class="danger" onclick="delFunc('${f.id}')">Excluir</button></td></tr>`).join('')}
async function addMaterial(){const n=novoMat.value.trim(),p=Number(novoPreco.value);if(!n||p<0)return alert('Informe material e preço.');const r=await sb.from('materiais').insert({nome:n,preco_kg:p,ativo:true});if(r.error)return alert('Erro: '+r.error.message);novoMat.value='';novoPreco.value='';carregar()}async function addFuncionario(){const n=novoFunc.value.trim(),u=novoUser.value.trim(),p=novoPass.value;if(!n||!u||!p)return alert('Preencha nome, usuário e senha.');const r=await sb.from('funcionarios').insert({nome:n,usuario:u,pass:p,ativo:true});if(r.error)return alert('Erro ao adicionar funcionário: '+r.error.message);novoFunc.value='';novoUser.value='';novoPass.value='';await carregar();alert('Funcionário cadastrado e sincronizado!')}async function delMat(id){const r=await sb.from('materiais').update({ativo:false}).eq('id',id);if(r.error)alert(r.error.message);else carregar()}async function delFunc(id){const r=await sb.from('funcionarios').update({ativo:false}).eq('id',id);if(r.error)alert(r.error.message);else carregar()}
material.onchange=updateTotal;peso.oninput=updateTotal;</script></body></html>
