<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174a72"><title>Controle de Vendas</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17212b}.login{min-height:100vh;display:grid;place-items:center}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0001;margin:12px 0}.login-card{width:min(390px,86%)}label{display:block;font-weight:700;margin:10px 0 5px}input,select,button{box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #ccd5dd;font:inherit}input,select{width:100%}button{cursor:pointer}.primary{background:#174a72;color:#fff;border:0}.hidden{display:none}.err{margin-top:12px;padding:10px;border-radius:8px;background:#fdecec;color:#a00}.ok{margin-top:12px;padding:10px;border-radius:8px;background:#e8f7ed;color:#176b35}header{background:#174a72;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}header button{width:auto;background:#fff;color:#174a72;border:0}main{max-width:1000px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><section id="loginView" class="login"><div class="card login-card"><h1>Controle de Vendas</h1><label>Usuário</label><input id="loginUser" autocomplete="username"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password"><button class="primary" id="entrar" style="width:100%;margin-top:12px">ENTRAR</button><div id="loginMsg"></div><p>Administrador: <b>admin</b> / <b>1234</b></p></div></section><section id="appView" class="hidden"><header><b>Controle de Vendas</b><button id="sair">Sair</button></header><main><div class="card"><h2 id="titulo"></h2><p class="ok">Conectado ao banco compartilhado.</p></div><div id="adminArea" class="hidden"><div class="grid"><div class="card"><h3>Funcionários</h3><b id="nFunc">-</b></div><div class="card"><h3>Materiais</h3><b id="nMat">-</b></div><div class="card"><h3>Vendas</h3><b id="nVen">-</b></div></div><div class="card"><h3>Cadastrar funcionário</h3><div class="row"><input id="fnome" placeholder="Nome"><input id="fusuario" placeholder="Usuário"><input id="fsenha" type="password" placeholder="Senha"><button class="primary" id="addFunc">Cadastrar</button></div><div id="funcMsg"></div></div><div class="card"><h3>Funcionários cadastrados</h3><div id="funcList">Carregando...</div></div></div><div id="funcArea" class="hidden"><div class="card"><h3>Registrar venda</h3><label>Material</label><select id="material"></select><label>Peso (kg)</label><input id="peso" type="number" step="0.01"><label>Observação</label><input id="obs"><button class="primary" id="addVenda" style="margin-top:12px">Registrar venda</button><div id="vendaMsg"></div></div></div></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://afokstrkwuncflsokfzi.supabase.co';const SUPABASE_KEY='sb_publishable_K2kGPV_hivFxCxjn5RNudA_2Y4MRzNS';let db=null;let sess=null;const $=id=>document.getElementById(id);function msg(id,t,ok=false){const el=$(id);el.className=ok?'ok':'err';el.textContent=t}function ensureDb(){if(db)return db;if(!window.supabase)return null;db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return db}async function login(){const u=$('loginUser').value.trim();const p=$('loginPass').value;if(!u||!p){msg('loginMsg','Informe usuário e senha.');return}if(u==='admin'&&p==='1234'){sess={admin:true,id:null,nome:'Administrador'};openApp();return}const client=ensureDb();if(!client){msg('loginMsg','Biblioteca do banco não carregou. Atualize a página.');return}try{const result=await client.from('funcionarios').select('id,nome,usuario,pass,ativo').eq('usuario',u).eq('pass',p).eq('ativo',true).maybeSingle();if(result.error)throw result.error;if(!result.data){msg('loginMsg','Usuário ou senha inválidos.');return}sess={admin:false,id:result.data.id,nome:result.data.nome};openApp()}catch(e){msg('loginMsg','Erro ao conectar: '+e.message)}}async function openApp(){$('loginView').className='hidden';$('appView').className='';$('titulo').textContent='Olá, '+sess.nome;if(sess.admin){$('adminArea').className='';await loadAdmin()}else{$('funcArea').className='';await loadMaterials()}}async function loadAdmin(){const client=ensureDb();if(!client){$('funcList').textContent='Banco indisponível.';return}try{const [f,m,v]=await Promise.all([client.from('funcionarios').select('id,nome,usuario,ativo'),client.from('materiais').select('id'),client.from('vendas').select('id')]);if(f.error)throw f.error;if(m.error)throw m.error;if(v.error)throw v.error;$('nFunc').textContent=f.data.length;$('nMat').textContent=m.data.length;$('nVen').textContent=v.data.length;$('funcList').innerHTML=f.data.length?'<table><tr><th>Nome</th><th>Usuário</th><th>Ativo</th></tr>'+f.data.map(x=>'<tr><td>'+x.nome+'</td><td>'+x.usuario+'</td><td>'+(x.ativo?'Sim':'Não')+'</td></tr>').join('')+'</table>':'Nenhum funcionário cadastrado.'}catch(e){$('funcList').textContent='Erro: '+e.message}}async function loadMaterials(){const client=ensureDb();if(!client){msg('vendaMsg','Banco indisponível.');return}const result=await client.from('materiais').select('id,nome,preco_kg').eq('ativo',true).order('nome');if(result.error){msg('vendaMsg','Erro ao carregar materiais: '+result.error.message);return}$('material').innerHTML=result.data.map(x=>'<option value="'+x.id+'" data-preco="'+x.preco_kg+'">'+x.nome+' - R$ '+Number(x.preco_kg).toFixed(2)+'/kg</option>').join('')}async function addFunc(){const client=ensureDb();if(!client){msg('funcMsg','Banco indisponível.');return}const nome=$('fnome').value.trim();const usuario=$('fusuario').value.trim();const pass=$('fsenha').value;if(!nome||!usuario||!pass){msg('funcMsg','Preencha nome, usuário e senha.');return}const result=await client.from('funcionarios').insert({nome: nome,usuario: usuario,pass: pass,ativo: true});if(result.error){msg('funcMsg','Erro ao adicionar funcionário: '+result.error.message);return}msg('funcMsg','Funcionário cadastrado com sucesso.',true);$('fnome').value='';$('fusuario').value='';$('fsenha').value='';await loadAdmin()}async function addVenda(){const client=ensureDb();if(!client){msg('vendaMsg','Banco indisponível.');return}const opt=$('material').selectedOptions[0];const peso=Number($('peso').value);if(!opt||!peso){msg('vendaMsg','Informe material e peso.');return}const material_id=Number(opt.value);const preco_kg=Number(opt.dataset.preco);const total=peso*preco_kg;const result=await client.from('vendas').insert({data:new Date().toISOString().slice(0,10),funcionario_id:sess.id,material_id:material_id,peso_kg:peso,preco_kg:preco_kg,total:total,observacao:$('obs').value.trim()});if(result.error){msg('vendaMsg','Erro ao registrar venda: '+result.error.message);return}msg('vendaMsg','Venda registrada com sucesso. Total: R$ '+total.toFixed(2),true);$('peso').value='';$('obs').value=''}window.addEventListener('DOMContentLoaded',function(){$('entrar').addEventListener('click',login);$('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')login()});$('addFunc').addEventListener('click',addFunc);$('addVenda').addEventListener('click',addVenda);$('sair').addEventListener('click',function(){location.reload()})});</script></body></html>
