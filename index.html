<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Vendas</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17212b}header{background:#174a72;color:#fff;padding:16px;display:flex;justify-content:space-between}main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;padding:18px;border-radius:12px;margin:12px 0}input,button{padding:11px;border-radius:8px;border:1px solid #ccd5dd;font:inherit}button{cursor:pointer}.primary{background:#174a72;color:#fff;border:0}.hidden{display:none}.login{min-height:100vh;display:grid;place-items:center}.login-card{width:min(400px,90%)}label{display:block;font-weight:bold;margin:8px 0 5px}.err{margin-top:10px;padding:10px;background:#fdecec}.ok{margin-top:10px;padding:10px;background:#e8f7ed}</style></head><body><div id="loginView" class="login"><div class="card login-card"><h1>Controle de Vendas</h1><label>Usuário</label><input id="loginUser" style="width:100%" autocomplete="username"><label>Senha</label><input id="loginPass" type="password" style="width:100%" autocomplete="current-password"><button class="primary" style="width:100%;margin-top:12px" id="entrar">ENTRAR</button><div id="loginMsg"></div><p>Administrador: <b>admin</b> / <b>1234</b></p></div></div><div id="appView" class="hidden"><header><b>Controle de Vendas</b><button id="sair">Sair</button></header><main><div class="card"><h2 id="titulo"></h2><div id="conteudo"></div></div></main></div><script>let usuario=null;const $=id=>document.getElementById(id);function erro(t){$('loginMsg').className='err';$('loginMsg').textContent=t}function abrir(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('titulo').textContent='Olá, '+usuario.nome;$('conteudo').innerHTML=usuario.admin?'<p>Você entrou como administrador.</p><p class="ok">Login funcionando corretamente.</p>':'<p>Você entrou como funcionário.</p><p class="ok">Seu acesso está conectado ao banco compartilhado.</p>'}function login(){const u=$('loginUser').value.trim(),p=$('loginPass').value;if(!u||!p)return erro('Informe usuário e senha.');if(u==='admin'&&p==='1234'){usuario={id:null,nome:'Administrador',admin:true};abrir();return}erro('Login de funcionário será conectado ao Supabase na próxima etapa.')}$('entrar').addEventListener('click',login);$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('sair').addEventListener('click',()=>location.reload());</script></body></html>
