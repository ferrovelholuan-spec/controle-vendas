<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174a72"><title>Controle de Vendas</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17212b}.login{min-height:100vh;display:grid;place-items:center}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 3px 15px #0001}.login-card{width:min(390px,86%)}label{display:block;font-weight:700;margin:12px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #ccd5dd;font:inherit}button{cursor:pointer}.primary{background:#174a72;color:#fff;border:0;margin-top:14px}.hidden{display:none}.err{margin-top:12px;padding:10px;border-radius:8px;background:#fdecec;color:#a00}.ok{margin-top:12px;padding:10px;border-radius:8px;background:#e8f7ed;color:#176b35}header{background:#174a72;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}header button{width:auto;padding:8px 14px;background:#fff;color:#174a72;border:0}main{max-width:1000px;margin:auto;padding:18px}</style></head><body><section id="loginView" class="login"><div class="card login-card"><h1>Controle de Vendas</h1><label for="loginUser">Usuário</label><input id="loginUser" autocomplete="username"><label for="loginPass">Senha</label><input id="loginPass" type="password" autocomplete="current-password"><button class="primary" id="entrar" type="button">ENTRAR</button><div id="loginMsg"></div><p>Administrador: <b>admin</b> / <b>1234</b></p></div></section><section id="appView" class="hidden"><header><b>Controle de Vendas</b><button id="sair" type="button">Sair</button></header><main><div class="card"><h2 id="titulo"></h2><p class="ok">Login funcionando corretamente.</p><div id="conteudo"></div></div></main></section><script>var usuario=null;function $(id){return document.getElementById(id)}function erro(t){$('loginMsg').className='err';$('loginMsg').textContent=t}function abrir(){ $('loginView').className='hidden';$('appView').className='';$('titulo').textContent='Olá, '+usuario.nome;$('conteudo').innerHTML=usuario.admin?'<p>Você entrou como administrador.</p>':'<p>Você entrou como funcionário.</p>'}function login(){var u=$('loginUser').value.trim(),p=$('loginPass').value;if(!u||!p){erro('Informe usuário e senha.');return}if(u==='admin'&&p==='1234'){usuario={nome:'Administrador',admin:true};abrir();return}erro('Usuário ou senha inválidos.')}window.addEventListener('DOMContentLoaded',function(){$('entrar').onclick=login;$('loginPass').onkeydown=function(e){if(e.key==='Enter')login()};$('sair').onclick=function(){location.reload()}});</script></body></html>
