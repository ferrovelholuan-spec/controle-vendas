<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174a72"><title>Controle de Vendas</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17212b}.login{min-height:100vh;display:grid;place-items:center}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0001;margin:12px 0}.login-card{width:min(390px,86%)}label{display:block;font-weight:700;margin:10px 0 5px}input,select,button{box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #ccd5dd;font:inherit}input,select{width:100%}button{cursor:pointer}.primary{background:#174a72;color:#fff;border:0}.hidden{display:none}.err{margin-top:12px;padding:10px;border-radius:8px;background:#fdecec;color:#a00}.ok{margin-top:12px;padding:10px;border-radius:8px;background:#e8f7ed;color:#176b35}header{background:#174a72;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}header button{width:auto;background:#fff;color:#174a72;border:0}main{max-width:1000px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><section id="loginView" class="login"><div class="card login-card"><h1>Controle de Vendas</h1><label>Usuário</label><input id="loginUser" autocomplete="username"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password"><button class="primary" id="entrar" style="width:100%;margin-top:12px">ENTRAR</button><div id="loginMsg"></div><p>Administrador: <b>admin</b> / <b>1234</b></p></div></section><section id="appView" class="hidden"><header><b>Controle de Vendas</b><button id="sair">Sair</button></header><main><div class="card"><h2 id="titulo"></h2><p class="ok">Conectado ao banco compartilhado.</p></div><div id="adminArea" class="hidden"><div class="grid"><div class="card"><h3>Funcionários</h3><b id="nFunc">-</b></div><div class="card"><h3>Materiais</h3><b id="nMat">-</b></div><div class="card"><h3>Vendas</h3><b id="nVen">-</b></div></div><div class="card"><h3>Cadastrar funcionário</h3><div class="row"><input id="fnome" placeholder="Nome"><input id="fusuario" placeholder="Usuário"><input id="fsenha" type="password" placeholder="Senha"><button class="primary" id="addFunc">Cadastrar</button></div><div id="funcMsg"></div></div><div class="card"><h3>Funcionários cadastrados</h3><div id="funcList">Carregando...</div></div></div><div id="funcArea" class="hidden"><div class="card"><h3>Registrar venda</h3><label>Material</label><select id="material"></select><label>Peso (kg)</label><input id="peso" type="number" step="0.01"><label>Observação</label><input id="obs"><button class="primary" id="addVenda" style="margin-top:12px">Registrar venda</button><div id="vendaMsg"></div></div></div></main></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://afokstrkwuncflsokfzi.supabase.co';const KEY='sb_publishable_K2kGPV_hivFxCxjn5RNudA_2Y4MRzNS';const db=window.supabase.createClient(URL,KEY);let sess=null;const $=id=>document.getElementById(id);const msg=(id,t,ok=false)=>{$(id).className=ok?'ok':'err';$(id).textContent=t};async function login(){const u=$('loginUser').value.trim(),p=$('loginPass').value;if(!u||!p)return msg('loginMsg','Informe usuário e senha.');if(u==='admin'&&p==='1234'){sess={admin:true,id:null,nome:'Administrador'};return openApp()}try{const {data,error}=await db.from('funcionarios').select('id,nome,usuario,pass,ativo').eq('usuario',u).eq('pass',p).eq('ativo',true).maybeSingle();if(error)throw error;if(!data)return msg('loginMsg','Usuário ou senha inválidos.');sess={admin:false,id:data.id,nome:data.nome};openApp()}catch(e){msg('loginMsg','Erro ao conectar: '+e.message)}}async function openApp(){$('loginView').className='hidden';$('appView').className='';$('titulo').textContent='Olá, '+sess.nome;if(sess.admin){$('adminArea').className='';await loadAdmin()}else{$('funcArea').className='';await loadMaterials()}}async function loadAdmin(){try{const [f,m,v]=await Promise.all([db.from('funcionarios').select('id,nome,usuario,ativo'),db.from('materiais').select('id'),db.from('vendas').select('id')]);if(f.error||m.error||v.error)throw(f.error||m.error||v.error);$('nFunc').textContent=f.data.length;$('nMat').textContent=m.data.length;$('nVen').textContent=v.data.length;$('funcList').innerHTML=f.data.length?'<table><tr><th>Nome</th><th>Usuário</th><th>Ativo</th></tr>'+f.data.map(x=>'<tr><td>'+x.nome+'</td><td>'+x.usuario+'</td><td>'+(x.ativo?'Sim':'Não')+'</td></tr>').join('')+'</table>':'Nenhum funcionário cadastrado.'}catch(e){$('funcList').textContent='Erro: '+e.message}}async function loadMaterials(){const {data,error}=await db.from('materiais').select('id,nome,preco_kg').eq('ativo',true).order('nome');if(error)return msg('vendaMsg','Erro ao carregar materiais: '+error.message);$('material').innerHTML=data.map(x=>'<option value="'+x.id+'" data-preco="'+x.preco_kg+'">'+x.nome+' - R$ '+Number(x.preco_kg).toFixed(2)+'/kg</option>').join('')}async function addFunc(){const nome=$('fnome').value.trim(),usuario=$('fusuario').value.trim(),pass=$('fsenha').value;if(!nome||!usuario||!pass)return msg('funcMsg','Preencha nome, usuário e senha.');const {error}=await db.from('funcionarios').insert({nome,usuario,pass,ativo:true});if(error)return msg('funcMsg','Erro ao adicionar funcionário: '+error.message);msg('funcMsg','Funcionário cadastrado com sucesso.',true);$('fnome').value='';$('fusuario').value='';$('fsenha').value='';loadAdmin()}async function addVenda(){const opt=$('material').selectedOptions[0],peso=Number($('peso').value);if(!opt||!peso)return msg('vendaMsg','Informe material e peso.');const material_id=Number(opt.value),preco_kg=Number(opt.dataset.preco),total=peso*preco_kg;const {error}=await db.from('vendas').insert({data:new Date().toISOString().slice(0,10),funcionario_id:sess.id,material_id,peso_kg:peso,preco_kg,total,observacao:$('obs').value.trim()});if(error)return msg('vendaMsg','Erro ao registrar venda: '+error.message);msg('vendaMsg','Venda registrada com sucesso. Total: R$ '+total.toFixed(2),true);$('peso').value='';$('obs').value='')}window.addEventListener('DOMContentLoaded',()=>{$('entrar').onclick=login;$('loginPass').onkeydown=e=>{if(e.key==='Enter')login()};$('addFunc').onclick=addFunc;$('addVenda').onclick=addVenda;$('sair').onclick=()=>location.reload()});</script></body></html>
